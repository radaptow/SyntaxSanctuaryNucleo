services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ""
      MARIADB_DATABASE: "syntaxsanctuary"
      MARIADB_USER: "radaptow"
      MARIADB_PASSWORD: ""
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  web:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    env_file:
      - .env
    environment:
      OLLAMA_HOST: "http://100.111.244.83:11434"
      DB_HOST: "db"
      DB_NAME: "syntaxsanctuary"
      DB_USER: "radaptow"
      DB_PASS: ""
      ARYI_WORKSPACE: "/workspace"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/var/www/html
      - ${ARYI_HOST_DIR:-./workspace}:/workspace

volumes:
  db_data:
